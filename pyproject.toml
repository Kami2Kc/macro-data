[project]
name = "macro-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kamil Cwigun", email = "kamiwgun@googlemail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
macro-data = "macro_data:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
